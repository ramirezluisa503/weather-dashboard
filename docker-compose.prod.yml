# Ajustes de PRODUCCIÓN que se aplican encima de docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Único punto de entrada: Caddy (80/443). Backend y frontend dejan de publicar puertos.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificados HTTPS (no se pierden al reiniciar)
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    # Daphne directo (servidor ASGI de producción) en vez de runserver
    command: sh -c "python manage.py migrate && daphne -b 0.0.0.0 -p 8000 config.asgi:application"
    ports: !reset []
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # El navegador llama a la API en el MISMO dominio (https → el WebSocket usa wss)
        VITE_API_URL: https://${SITE_DOMAIN}
    ports: !reset []
    restart: unless-stopped

  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  celery-worker:
    restart: unless-stopped

  celery-beat:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
