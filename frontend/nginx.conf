server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # App de una sola página: cualquier ruta desconocida devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Imágenes, íconos, JS y CSS: el navegador los guarda en caché 7 días
    location ~* \.(webp|svg|js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}